name: build-windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build single-file exe
        working-directory: src
        run: |
          python gen_assets.py
          python -m PyInstaller --noconfirm --clean --onefile --noconsole --name CopyPad --icon app.ico --add-data "app.ico;." --version-file version.txt CopyPadApp.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CopyPad-exe
          path: src/dist/CopyPad.exe

      - name: Attach exe to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src/dist/CopyPad.exe
